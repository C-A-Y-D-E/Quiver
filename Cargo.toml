[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/wallet-tx", "crates/keyvault-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Argon2 is painfully slow unoptimised; keep it fast even in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
