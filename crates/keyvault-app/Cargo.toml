[package]
name = "keyvault-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KeyVault — desktop vault for wallet private keys (GPUI)"

[[bin]]
name = "keyvault"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core" }
wallet-tx = { path = "../wallet-tx" }
gpui-kit = "0.7"
anyhow = "1"
zeroize = "1"
serde_json = "1"
# Touch ID / Windows Hello prompt, and the OS keychain for the device key.
robius-authentication = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[build-dependencies]
embed-resource = "3"
