[package]
name = "wallet-tx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build, sign and broadcast native + token transfers for EVM chains and Solana"

[dependencies]
vault-core = { path = "../vault-core" }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ethnum = "1"
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
curve25519-dalek = "4"
bs58 = "0.5"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
zeroize = "1"
